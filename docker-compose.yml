services:
  eagle-x:
    build: .
    image: eagle-x-core:1.3
    container_name: eagle-x-core
    ports:
      - "8080:8080"
    environment:
      EAGLE_API_TOKEN: ${EAGLE_API_TOKEN:?set EAGLE_API_TOKEN in .env}
      EAGLE_REQUIRE_STRONG_TOKEN: ${EAGLE_REQUIRE_STRONG_TOKEN:-1}
      EAGLE_LIVE_MONITOR: "1"
      EAGLE_DATA_DIR: /app/data
      EAGLE_LOG_DIR: /app/logs
      EAGLE_CORS_ORIGINS: ${EAGLE_CORS_ORIGINS:-*}
      EAGLE_PROTECT_READ_APIS: ${EAGLE_PROTECT_READ_APIS:-0}
      EAGLE_WEBHOOK_URL: ${EAGLE_WEBHOOK_URL:-}
      LOG_LEVEL: INFO
    volumes:
      - eagle_data:/app/data
      - eagle_logs:/app/logs
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  eagle_data:
  eagle_logs:
