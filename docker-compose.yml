services:
  eagle-x:
    build: .
    image: eagle-x-core:1.0
    container_name: eagle-x-core
    ports:
      - "8080:8080"
    environment:
      EAGLE_API_TOKEN: ${EAGLE_API_TOKEN:-eagle-dev-token-change-me}
      EAGLE_LIVE_MONITOR: "1"
      EAGLE_DATA_DIR: /app/data
      EAGLE_LOG_DIR: /app/logs
      LOG_LEVEL: INFO
    volumes:
      - eagle_data:/app/data
      - eagle_logs:/app/logs
    restart: unless-stopped

volumes:
  eagle_data:
  eagle_logs:
