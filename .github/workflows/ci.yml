name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Test
        env:
          EAGLE_LIVE_MONITOR: "0"
          EAGLE_DATA_DIR: ${{ runner.temp }}/data
          EAGLE_LOG_DIR: ${{ runner.temp }}/logs
          EAGLE_API_TOKEN: "ci-test-token-not-for-prod"
          EAGLE_REQUIRE_STRONG_TOKEN: "0"
        run: |
          mkdir -p "$EAGLE_DATA_DIR" "$EAGLE_LOG_DIR"
          python -m pytest -q --tb=short
